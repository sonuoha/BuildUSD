name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
      - dev-stable

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install build ruff

      - name: Syntax lint
        run: python -m ruff check --select E9 src tests

      - name: Import and CLI smoke test
        run: |
          python -m buildusd --help
          python -m ifc_converter --help

      - name: Tests
        run: python -m pytest --basetemp .pytest_tmp

      - name: Build distribution
        run: python -m build

  usd_validation:
    name: USD validation / ubuntu / Python 3.11
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and USD validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[usd-validation]"

      - name: NVIDIA USD asset validation tests
        run: python -m pytest -m "usd_validation" --basetemp .pytest_tmp_usd_validation

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - test
      - usd_validation
    if: always()

    steps:
      - name: Require all matrix jobs to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.usd_validation.result }}" != "success" ]; then
            echo "Test matrix result: ${{ needs.test.result }}"
            echo "USD validation result: ${{ needs.usd_validation.result }}"
            exit 1
          fi
